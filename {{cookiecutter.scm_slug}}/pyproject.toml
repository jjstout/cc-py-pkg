[project]
name = "{{cookiecutter.scm_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.project_short_description}}"
readme = "README.md"
authors = [
    { name = "{{cookiecutter.full_name}}", email = "{{cookiecutter.email}}" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    {% if cookiecutter.project_type == "tool" -%}
    "typer>=0.16.0",
    {% endif -%}
]

{% if cookiecutter.project_type == "tool" -%}
[project.scripts]
{{cookiecutter.scm_slug}} = "{{cookiecutter.pkg_slug}}.cli:app"
{%- endif %}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bump-my-version>=1.2.0",
    "invoke>=2.2.0",
    "pydocstyle>=6.3.0",
    "pydotenv>=0.0.7",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
    "ty>=0.0.1a12",
]

[tool.ruff]
line-length = 110
target-version = "py313"
fix = true  # Automatically fix issues

[tool.ruff.lint]
select = ["E", "F", "I"]  # Enable specific rules (E: pycodestyle, F: Pyflakes, I: isort)

[tool.bumpversion]
current_version = "{{cookiecutter.version}}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/{{cookiecutter.pkg_slug}}/__init__.py"
